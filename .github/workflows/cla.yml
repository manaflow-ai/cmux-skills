name: "CLA Assistant v3"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,closed,reopened,synchronize,edited,ready_for_review]

# Jobs declare only the permissions they need.
permissions: {}

# Change this marker only when the CLA policy or maintained action changes.
# It keeps exact-head workers tied to a stable policy generation.
env:
  CLA_GENERATION: 'v2.2-action-212a0f2dd659b24b48a30ba35966e06dc41736af'

jobs:
  CLACommentGate:
    name: "Validate CLA trigger"
    # This job is intentionally unprivileged. The job-level expression is a
    # coarse admission filter, and the shell step below is the exact,
    # case-sensitive check. GitHub expressions compare strings without case,
    # so the shell remains the authority for the declaration itself.
    # Issue comments must come from human users. A future automation exception
    # requires a separately reviewed positive numeric allowlist-ids entry in
    # the maintained action, never a name-based workflow allowlist.
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'edited' ||
          github.event.action == 'ready_for_review'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        github.event.comment.user.id != null &&
        github.event.comment.user.id > 0 &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-24.04 # github-hosted-required: CLA policy jobs
    timeout-minutes: 5
    # The group includes the immutable comment ID or workflow run ID. GitHub
    # retains one pending run per group, so one valid event cannot replace a
    # different pending event. The PR prefix keeps admission scoped to this
    # repository and pull request without sharing a queue across PRs.
    concurrency:
      group: "cla-admission-${{ github.repository }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id || github.run_id }}"
      cancel-in-progress: false
    permissions: {}
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - name: "Validate exact CLA trigger"
        id: admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type || '' }}
          COMMENT_USER_ID: "${{ github.event.comment.user.id || '' }}"
          COMMENT_ASSOCIATION: "${{ github.event.comment.author_association || '' }}"
          PR_AUTHOR_ID: "${{ github.event.issue.user.id || '' }}"
          COMMENT_ISSUE_STATE: "${{ github.event.issue.state || '' }}"
          COMMENT_IS_PULL_REQUEST: "${{ github.event.issue.pull_request != null }}"
        run: |
          set -euo pipefail
          emit_admission() {
            local value="$1"
            if ! printf 'admitted=%s\n' "${value}" >> "${GITHUB_OUTPUT:-}"; then
              echo "::error::Could not publish the CLA admission result"
              return 1
            fi
          }
          reject_trigger() {
            if ! emit_admission false; then
              return 1
            fi
            echo "::notice::The event did not contain an exact human CLA trigger; no signer run is admitted."
          }
          if [[ -z "${GITHUB_OUTPUT:-}" ]]; then
            echo "::error::GITHUB_OUTPUT is unavailable; refusing to admit a CLA trigger"
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${EVENT_ACTION}" != "created" ||
                  "${COMMENT_ISSUE_STATE}" != "open" ||
                  "${COMMENT_IS_PULL_REQUEST}" != "true" ||
                  "${COMMENT_USER_TYPE}" != "User" ]] ||
               ! [[ "${COMMENT_USER_ID}" =~ ^[1-9][0-9]*$ ]] ||
               [[ "${COMMENT_BODY}" != "recheck" &&
                  "${COMMENT_BODY}" != "I have read the CLA Document and I hereby sign the CLA" ]]; then
              if ! reject_trigger; then
                exit 1
              fi
              exit 0
            fi
            if [[ "${COMMENT_BODY}" == "recheck" ]]; then
              if [[ "${COMMENT_USER_ID}" == "${PR_AUTHOR_ID}" ]]; then
                emit_admission true
              else
                case "${COMMENT_ASSOCIATION}" in
                  OWNER|MEMBER|COLLABORATOR) emit_admission true ;;
                  *) reject_trigger ;;
                esac
              fi
            else
              emit_admission true
            fi
          elif [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            case "${EVENT_ACTION}" in
              opened|reopened|synchronize|edited|ready_for_review) ;;
              *)
                if ! reject_trigger; then
                  exit 1
                fi
                exit 0
                ;;
            esac
            emit_admission true
          else
            echo "::error::The event is not an accepted CLA trigger"
            exit 1
          fi

  CLASignerPreflight:
    name: "CLA signer preflight"
    needs: CLACommentGate
    # Authenticate the exact current signing comment in a separate read-only
    # job. The write-capable signer never receives a token for an unadmitted
    # or unauthenticated comment.
    if: >-
      always() &&
      needs.CLACommentGate.result == 'success' &&
      needs.CLACommentGate.outputs.admitted == 'true' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-24.04 # github-hosted-required: CLA policy jobs
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      signer_authorized: ${{ steps.preflight.outputs.signer_authorized }}
      opener_not_in_commits: ${{ steps.preflight.outputs.opener_not_in_commits }}
      head_sha: ${{ steps.preflight.outputs.head_sha }}
      base_sha: ${{ steps.preflight.outputs.base_sha }}
      comment_id: ${{ steps.preflight.outputs.comment_id }}
      comment_created_at: ${{ steps.preflight.outputs.comment_created_at }}
      comment_author_id: ${{ steps.preflight.outputs.comment_author_id }}
    steps:
      - name: "Authenticate current CLA signer"
        id: preflight
        uses: manaflow-ai/cla-github-action@212a0f2dd659b24b48a30ba35966e06dc41736af # signer-preflight and cla_passed output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: 'signer-preflight'
          path-to-signatures: 'signatures/version2/cla.json'
          path-to-document: 'https://github.com/manaflow-ai/cmux-skills/blob/${{ github.workflow_sha }}/CLA.md'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          required-base-ref: 'main'
          require-opener-as-author: 'true'
          allowlist-ids: '38676809,67667005'


  CLAAssistant:
    name: "CLA Signer"
    needs:
      - CLACommentGate
      - CLASignerPreflight
    outputs:
      validated_head_sha: ${{ steps.cla-revision.outputs.head_sha || '' }}
      validated_base_sha: ${{ steps.cla-revision.outputs.base_sha || '' }}
      # The maintained action sets cla_passed only after all signatures are
      # valid and its final bot comment succeeds. Keep a false default for
      # action errors and skipped paths.
      policy_result: ${{ steps.cla-action.outputs.cla_passed || 'false' }}
    # Keep a visible signer result when the unprivileged gate rejects a
    # case-insensitive expression match. The first step fails closed before
    # any privileged API operation.
    if: >-
      always() &&
      needs.CLACommentGate.result == 'success' &&
      needs.CLACommentGate.outputs.admitted == 'true' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          (
            github.event.action == 'opened' ||
            github.event.action == 'reopened' ||
            github.event.action == 'synchronize' ||
          github.event.action == 'edited' ||
          github.event.action == 'ready_for_review'
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          github.event.comment.user.type == 'User' &&
          github.event.comment.user.id != null &&
          github.event.comment.user.id > 0 &&
          (
            (
              github.event.comment.body == 'recheck' &&
              (
                github.event.comment.user.id == github.event.issue.user.id ||
                github.event.comment.author_association == 'OWNER' ||
                github.event.comment.author_association == 'MEMBER' ||
                github.event.comment.author_association == 'COLLABORATOR'
              )
            ) ||
            (
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' &&
              needs.CLASignerPreflight.result == 'success' &&
              needs.CLASignerPreflight.outputs.head_sha != '' &&
              needs.CLASignerPreflight.outputs.base_sha != '' &&
              needs.CLASignerPreflight.outputs.signer_authorized == 'true'
            )
          )
        )
      )
    runs-on: ubuntu-24.04 # github-hosted-required: CLA policy jobs
    timeout-minutes: 10
    # Include the immutable event ID in the group so GitHub cannot replace a
    # pending signing event. Distinct events may write the shared ledger at the
    # same time; the maintained action uses bounded optimistic compare-and-swap
    # retries and live-head checks to merge conflicts safely.
    # The merged-only lock has its own per-PR queue.
    concurrency:
      group: "cla-signatures-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || github.run_id }}"
      cancel-in-progress: false
    # Keep the token scoped to the GitHub API operations used by this job.
    permissions:
      contents: write
      issues: write
      # The action only reads pull-request metadata. Keep this permission read-only;
      # issue comments and ledger commits use the narrowly scoped permissions above.
      pull-requests: read
    steps:
      - name: "Require successful CLA admission"
        if: ${{ always() }}
        env:
          GATE_RESULT: "${{ needs.CLACommentGate.result }}"
          GATE_ADMITTED: "${{ needs.CLACommentGate.outputs.admitted || '' }}"
        run: |
          set -euo pipefail
          if [[ "${GATE_RESULT}" != "success" || "${GATE_ADMITTED}" != "true" ]]; then
            echo "::error::The unprivileged CLA trigger gate did not admit this event; refusing to run the signer."
            exit 1
          fi
      - name: "Reject pull requests with more than 1000 commits"
        if: ${{ success() }}
        # Keep this hard 1,000-commit availability bound as a conservative
        # workflow limit while the maintained action's identity assertion
        # envelope is reviewed. This prevents unbounded API work.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref || '' }}"
          EVENT_HEAD_REPO: "${{ github.event.pull_request.head.repo.full_name || '' }}"
          EVENT_HEAD_REPO_ID: "${{ github.event.pull_request.head.repo.id || '' }}"
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref || '' }}"
          EVENT_BASE_REPO: "${{ github.event.pull_request.base.repo.full_name || '' }}"
          EVENT_BASE_REPO_ID: "${{ github.event.pull_request.base.repo.id || '' }}"
          EVENT_OPENER_LOGIN: "${{ github.event.pull_request.user.login || '' }}"
          EVENT_OPENER_TYPE: "${{ github.event.pull_request.user.type || '' }}"
          EVENT_OPENER_ID: "${{ github.event.pull_request.user.id || '' }}"
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            case "$EVENT_ACTION" in
              opened|reopened|synchronize|edited|ready_for_review) ;;
              *)
                echo "::error::CLA preflight received an unsupported pull request event; refusing to run."
                exit 1
                ;;
            esac
          fi
          if ! live_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '{state: .state, head_sha: .head.sha, head_ref: .head.ref, head_repo: .head.repo.full_name, head_repo_id: .head.repo.id, base_sha: .base.sha, base_ref: .base.ref, base_repo: .base.repo.full_name, base_repo_id: .base.repo.id, opener_login: .user.login, opener_type: .user.type, opener_id: .user.id}' 2>/dev/null)"; then
            echo "::error::CLA preflight could not read live pull request metadata; refusing to run."
            exit 1
          fi
          if ! live_state="$(jq -er '.state' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_sha="$(jq -er '.head_sha' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_ref="$(jq -er '.head_ref' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_repo="$(jq -er '.head_repo' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_repo_id="$(jq -er '.head_repo_id' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_sha="$(jq -er '.base_sha' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_ref="$(jq -er '.base_ref' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_repo="$(jq -er '.base_repo' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_repo_id="$(jq -er '.base_repo_id' <<<"$live_pr" 2>/dev/null)" ||
             ! live_opener_login="$(jq -er '.opener_login' <<<"$live_pr" 2>/dev/null)" ||
             ! live_opener_type="$(jq -er '.opener_type' <<<"$live_pr" 2>/dev/null)" ||
             ! live_opener_id="$(jq -er '.opener_id' <<<"$live_pr" 2>/dev/null)"; then
            echo "::error::CLA preflight returned incomplete pull request metadata; refusing to run."
            exit 1
          fi
          # Bot-opened PRs stay rejected until a reviewed numeric opener
          # exemption is approved. Name-based allowlists are not allowed.
          if [[ "$live_state" != "open" ]] ||
             ! [[ "$live_head_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ -z "$live_head_ref" || -z "$live_head_repo" ]] ||
             ! [[ "$live_head_repo_id" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ -z "$live_base_ref" || -z "$live_base_repo" ]] ||
             ! [[ "$live_base_repo_id" =~ ^[1-9][0-9]*$ ]] ||
             [[ -z "$live_opener_login" || "$live_opener_type" != "User" ]] ||
             ! [[ "$live_opener_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CLA preflight found invalid or closed pull request metadata; refusing to run."
            exit 1
          fi
          if [[ "$live_base_repo" != "$GH_REPO" || "$live_base_ref" != "main" ]]; then
            echo "::error::CLA workflow only accepts open pull requests targeting this repository's main branch; refusing to run."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ -z "$EVENT_OPENER_LOGIN" || "$EVENT_OPENER_TYPE" != "User" ]] ||
               ! [[ "$EVENT_OPENER_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::CLA preflight found an invalid pull request opener identity in the event payload; refusing to run."
              exit 1
            fi
            if [[ "$EVENT_HEAD_SHA" != "$live_head_sha" ||
                  "$EVENT_HEAD_REF" != "$live_head_ref" ||
                  "$EVENT_HEAD_REPO" != "$live_head_repo" ||
                  "$EVENT_HEAD_REPO_ID" != "$live_head_repo_id" ||
                  "$EVENT_BASE_REF" != "$live_base_ref" ||
                  "$EVENT_BASE_REPO" != "$live_base_repo" ||
                  "$EVENT_BASE_REPO_ID" != "$live_base_repo_id" ||
                  "$EVENT_OPENER_LOGIN" != "$live_opener_login" ||
                  "$EVENT_OPENER_TYPE" != "$live_opener_type" ||
                  "$EVENT_OPENER_ID" != "$live_opener_id" ]]; then
              echo "::error::CLA preflight pull request metadata does not match the event payload; refusing to run."
              exit 1
            fi
          fi
          if ! commit_count="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits' 2>/dev/null)"; then
            echo "::error::CLA preflight could not read the pull request commit count; refusing to run."
            exit 1
          fi
          if ! [[ "$commit_count" =~ ^[0-9]+$ ]]; then
            echo "::error::CLA preflight returned an invalid pull request commit count; refusing to run."
            exit 1
          fi
          if (( commit_count > 1000 )); then
            echo "::error::CLA Assistant v3 accepts at most 1000 pull request commits. Split this pull request to 1000 or fewer commits before signing."
            exit 1
          fi
      - name: "Validate CLA comment command"
        if: ${{ success() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]] &&
             [[ "$COMMENT_BODY" != "recheck" ]] &&
             [[ "$COMMENT_BODY" != "I have read the CLA Document and I hereby sign the CLA" ]]; then
            echo "::error::CLA workflow accepts only the exact recheck command or exact electronic signature phrase; refusing to run."
            exit 1
          fi
      - name: "Validate bounded CLA comment history"
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target|issue_comment) ;;
            *) echo "::error::CLA history guard received an unsupported event; refusing to run."; exit 1 ;;
          esac
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CLA history guard received an invalid pull request number; refusing to run."
            exit 1
          fi
          comments_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}/comments"
          page=1
          while (( page <= 10 )); do
            if ! page_json="$(gh api "${comments_endpoint}?per_page=100&page=${page}" 2>/dev/null)"; then
              echo "::error::CLA history guard could not read issue comments; refusing to run."
              exit 1
            fi
            if ! jq -e '
              def valid_comment:
                ((.body | type) == "string" or (.body | type) == "null") and
                (.user == null or (
                  (.user | type) == "object" and
                  (.user.login | type) == "string" and
                  (.user.type | type) == "string" and
                  (.user.id | type) == "number" and
                  (.user.id | . > 0) and
                  (.user.id | . == floor)
                ));
              type == "array" and all(.[]; valid_comment)
            ' <<<"$page_json" >/dev/null 2>&1; then
              echo "::error::CLA history guard received malformed issue comments; refusing to run."
              exit 1
            fi
            if ! page_count="$(jq -r 'length' <<<"$page_json" 2>/dev/null)" ||
               ! [[ "$page_count" =~ ^[0-9]+$ ]] || (( page_count > 100 )); then
              echo "::error::CLA history guard received an invalid issue-comment page; refusing to run."
              exit 1
            fi
            if (( page_count < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          if (( page == 11 )); then
            if ! overflow_json="$(gh api "${comments_endpoint}?per_page=100&page=11" 2>/dev/null)"; then
              echo "::error::CLA history guard could not verify the 1000-comment limit; refusing to run."
              exit 1
            fi
            if ! jq -e '
              def valid_comment:
                ((.body | type) == "string" or (.body | type) == "null") and
                (.user == null or (
                  (.user | type) == "object" and
                  (.user.login | type) == "string" and
                  (.user.type | type) == "string" and
                  (.user.id | type) == "number" and
                  (.user.id | . > 0) and
                  (.user.id | . == floor)
                ));
              type == "array" and all(.[]; valid_comment)
            ' <<<"$overflow_json" >/dev/null 2>&1; then
              echo "::error::CLA history guard received malformed overflow comments; refusing to run."
              exit 1
            fi
            if ! overflow_count="$(jq -r 'length' <<<"$overflow_json" 2>/dev/null)" ||
               ! [[ "$overflow_count" =~ ^[0-9]+$ ]]; then
              echo "::error::CLA history guard received an invalid overflow page; refusing to run."
              exit 1
            fi
            if (( overflow_count > 0 )); then
              echo "::error::CLA history guard refuses pull requests with more than 1000 issue comments; refusing to run."
              exit 1
            fi
          fi
      - name: "Bind live pull request revision"
        id: cla-revision
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid pull request number"
            exit 1
          }
          pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || {
            echo "::error::Could not read the live pull request"
            exit 1
          }
          jq -e --arg repo "${GH_REPO}" --argjson number "${PR_NUMBER}" '
            .number == $number and .state == "open" and .merged_at == null and
            .base.ref == "main" and
            ((.base.repo.full_name | ascii_downcase) == ($repo | ascii_downcase)) and
            (.base.sha | type == "string" and test("^[0-9a-fA-F]{40}$")) and
            (.head.sha | type == "string" and test("^[0-9a-fA-F]{40}$")) and
            (.head.ref | type == "string" and length > 0 and length <= 255)
          ' <<<"${pr_json}" >/dev/null || {
            echo "::error::The live pull request is not valid for CLA"
            exit 1
          }
          printf 'head_sha=%s\nbase_sha=%s\n' "$(jq -er '.head.sha' <<<"${pr_json}")" "$(jq -er '.base.sha' <<<"${pr_json}")" >> "${GITHUB_OUTPUT}"
      - name: "CLA Assistant v3"
        id: cla-action
        continue-on-error: false
        if: ${{ success() }}
        # The action writes the signature ledger and issue comments. GitHub
        # creates the displayed job check run; the maintained source makes no
        # commit-status API call, so statuses:write is intentionally omitted.
        # Merged pull requests are locked by the separate job.
        uses: manaflow-ai/cla-github-action@212a0f2dd659b24b48a30ba35966e06dc41736af # PR9 cla_passed output, immutable merged action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version2/cla.json'
          # Bind this privileged write to the exact head and base authenticated by the read-only preflight.
          expected-head-sha: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' && needs.CLASignerPreflight.outputs.head_sha || steps.cla-revision.outputs.head_sha }}
          expected-base-sha: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' && needs.CLASignerPreflight.outputs.base_sha || steps.cla-revision.outputs.base_sha }}
          expected-comment-id: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' && needs.CLASignerPreflight.outputs.comment_id || '' }}
          expected-comment-created-at: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' && needs.CLASignerPreflight.outputs.comment_created_at || '' }}
          expected-comment-author-id: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' && needs.CLASignerPreflight.outputs.comment_author_id || '' }}
          path-to-document: 'https://github.com/manaflow-ai/cmux-skills/blob/${{ github.workflow_sha }}/CLA.md'
          # Locking is handled by the merged-only job below, which supplies a
          # valid reason and verifies the resulting lock state.
          lock-pullrequest-aftermerge: 'false'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          required-base-ref: 'main'
          require-opener-as-author: 'true'
          # Verified Manaflow org members. The maintained action applies
          # these numeric exemptions only to authenticated live PR openers,
          # never to commit metadata or comment authors.
          # @austinywang (Austin Wang, 38676809); @azooz2003-bit (Abdulaziz Albahar, 67667005)
          allowlist-ids: '38676809,67667005'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'

  CLAResult:
    name: "CLA Assistant v3"
    needs:
      - CLACommentGate
      - CLASignerPreflight
      - CLAAssistant
    # Issue-comment workflows run on the default branch SHA, not the PR head.
    # This result remains advisory until a trusted exact-head check worker
    # refreshes the PR check after a signature comment.
    if: >-
      always() &&
      needs.CLACommentGate.result == 'success' &&
      needs.CLACommentGate.outputs.admitted == 'true' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          (
            github.event.action == 'opened' ||
            github.event.action == 'reopened' ||
            github.event.action == 'synchronize' ||
          github.event.action == 'edited' ||
          github.event.action == 'ready_for_review'
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          github.event.comment.user.type == 'User' &&
          github.event.comment.user.id != null &&
          github.event.comment.user.id > 0 &&
          (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    runs-on: ubuntu-24.04 # github-hosted-required: CLA policy jobs
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: "Publish CLA result"
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          GATE_RESULT: ${{ needs.CLACommentGate.result }}
          GATE_ADMITTED: ${{ needs.CLACommentGate.outputs.admitted || '' }}
          PREFLIGHT_RESULT: ${{ needs.CLASignerPreflight.result }}
          SIGNER_AUTHORIZED: ${{ needs.CLASignerPreflight.outputs.signer_authorized || '' }}
          WRITER_RESULT: ${{ needs.CLAAssistant.result }}
          WRITER_POLICY_RESULT: ${{ needs.CLAAssistant.outputs.policy_result || '' }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${GATE_RESULT}" == "success" && "${GATE_ADMITTED}" == "true" ]] ||
            fail "The CLA trigger was not admitted."
          if [[ "${EVENT_NAME}" == "issue_comment" &&
                "${COMMENT_BODY}" == "I have read the CLA Document and I hereby sign the CLA" ]]; then
            [[ "${PREFLIGHT_RESULT}" == "success" && "${SIGNER_AUTHORIZED}" == "true" ]] ||
              fail "The signing comment did not pass authenticated signer preflight."
            [[ "${WRITER_RESULT}" == "success" && "${WRITER_POLICY_RESULT}" == "true" ]] ||
              fail "The CLA signer did not report a successful policy result."
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "issue_comment" &&
                "${COMMENT_BODY}" == "recheck" ]]; then
            case "${COMMENT_ASSOCIATION}" in
              OWNER|MEMBER|COLLABORATOR)
                [[ "${WRITER_RESULT}" == "success" && "${WRITER_POLICY_RESULT}" == "true" ]] ||
                  fail "The trusted CLA recheck did not report a successful policy result."
                ;;
              *)
                echo "::notice::Ignoring an untrusted CLA recheck; no privileged signer was started."
                ;;
            esac
            exit 0
          fi
          [[ "${WRITER_RESULT}" == "success" && "${WRITER_POLICY_RESULT}" == "true" ]] ||
            fail "The CLA signer did not report a successful policy result."

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04 # github-hosted-required: CLA policy jobs
    timeout-minutes: 10
    concurrency:
      # Keep merged-pull-request locks in their own per-PR queue. A later
      # lifecycle event must not replace a pending lock with a signer run.
      group: "cla-lock-${{ github.repository }}-${{ github.event.pull_request.number }}"
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_REPO: "${{ github.event.repository.full_name || '' }}"
          EVENT_REPO_ID: "${{ github.event.repository.id || '' }}"
          PR_NUMBER: "${{ github.event.pull_request.number || '' }}"
          EVENT_ACTION: "${{ github.event.action || '' }}"
          EVENT_STATE: "${{ github.event.pull_request.state || '' }}"
          EVENT_MERGED: "${{ github.event.pull_request.merged || false }}"
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref || '' }}"
          EVENT_BASE_REPO: "${{ github.event.pull_request.base.repo.full_name || '' }}"
          EVENT_BASE_REPO_ID: "${{ github.event.pull_request.base.repo.id || '' }}"
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref || '' }}"
          EVENT_HEAD_REPO: "${{ github.event.pull_request.head.repo.full_name || '' }}"
          EVENT_HEAD_REPO_ID: "${{ github.event.pull_request.head.repo.id || '' }}"
          EVENT_OPENER_LOGIN: "${{ github.event.pull_request.user.login || '' }}"
          EVENT_OPENER_ID: "${{ github.event.pull_request.user.id || '' }}"
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$EVENT_REPO" == "$GH_REPO" ]] || fail "CLA lock event targets an unexpected repository."
          [[ "$EVENT_REPO_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid repository ID."
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid pull request number."
          if [[ "$EVENT_ACTION" != "closed" || "$EVENT_STATE" != "closed" || "$EVENT_MERGED" != "true" ]]; then
            fail "CLA lock event is not a closed merged pull request."
          fi
          [[ "$EVENT_BASE_REF" == "main" ]] || fail "CLA lock event targets an unexpected base branch."
          [[ "$EVENT_BASE_REPO" == "$GH_REPO" ]] || fail "CLA lock event targets an unexpected base repository."
          [[ "$EVENT_BASE_REPO_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid base repository ID."
          [[ "$EVENT_BASE_REPO_ID" == "$EVENT_REPO_ID" ]] || fail "CLA lock event base repository ID does not match the event repository."
          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || fail "CLA lock event has no valid head SHA."
          if [[ -z "$EVENT_HEAD_REF" || "$EVENT_HEAD_REF" == *$'\n'* || "$EVENT_HEAD_REF" == *$'\r'* ]]; then
            fail "CLA lock event has no valid head ref."
          fi
          if [[ -z "$EVENT_HEAD_REPO" || -z "$EVENT_HEAD_REPO_ID" ]]; then
            [[ -z "$EVENT_HEAD_REPO" && -z "$EVENT_HEAD_REPO_ID" ]] || fail "CLA lock event has incomplete head repository metadata."
          else
            [[ "$EVENT_HEAD_REPO" == */* && "$EVENT_HEAD_REPO" != */*/* ]] || fail "CLA lock event has no valid head repository."
            [[ "$EVENT_HEAD_REPO_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid head repository ID."
          fi
          if [[ -z "$EVENT_OPENER_LOGIN" || "$EVENT_OPENER_LOGIN" == *$'\n'* || "$EVENT_OPENER_LOGIN" == *$'\r'* ]]; then
            fail "CLA lock event has no valid pull request opener."
          fi
          [[ "$EVENT_OPENER_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid opener ID."

          if ! live_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '{number: .number, state: .state, merged: .merged, base_ref: .base.ref, base_repo: .base.repo.full_name, base_repo_id: .base.repo.id, head_sha: .head.sha, head_ref: .head.ref, head_repo: (.head.repo | if . == null then null else {full_name: .full_name, id: .id} end), opener_login: .user.login, opener_id: .user.id}' 2>/dev/null)"; then
            fail "CLA lock step could not read live pull request metadata."
          fi
          # GitHub can advance or delete a source branch after merge. Validate
          # the live head shape, but bind only immutable base and opener data
          # to the closed event.
          if ! jq -e \
            --arg repo "$GH_REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg base_ref "$EVENT_BASE_REF" \
            --argjson base_repo_id "$EVENT_BASE_REPO_ID" \
            --arg opener_login "$EVENT_OPENER_LOGIN" \
            --argjson opener_id "$EVENT_OPENER_ID" '
              def nonempty_string:
                type == "string" and length > 0 and test("^[^\\r\\n]+$");
              def positive_integer:
                type == "number" and . > 0 and . == floor;
              def valid_head_repo:
                . == null or (
                  type == "object" and
                  (.full_name | nonempty_string and test("^[^/]+/[^/]+$")) and
                  (.id | positive_integer)
                );
              .number == $pr_number and
              .state == "closed" and
              .merged == true and
              (.base_ref | nonempty_string and . == $base_ref and . == "main") and
              (.base_repo | nonempty_string and ascii_downcase == ($repo | ascii_downcase)) and
              (.base_repo_id | positive_integer and . == $base_repo_id) and
              (.head_sha | type == "string" and test("^[0-9a-fA-F]{40}$")) and
              (.head_ref | nonempty_string) and
              (.head_repo | valid_head_repo) and
              (.opener_login | nonempty_string and ascii_downcase == ($opener_login | ascii_downcase)) and
              (.opener_id | positive_integer and . == $opener_id)
            ' <<<"$live_pr" >/dev/null 2>&1; then
            fail "CLA lock step found invalid or changed merged pull request identity."
          fi

          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            fail "CLA lock step could not read the pull request lock state."
          fi
          if [[ "$locked" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          [[ "$locked" == "false" ]] || fail "CLA lock step returned an invalid pull request lock state."
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>&1; then
            fail "CLA lock step could not lock the merged pull request."
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            fail "CLA lock step could not verify the pull request lock state."
          fi
          if [[ "$locked" != "true" ]]; then
            fail "CLA lock step did not observe the pull request as locked."
          fi
  CLAHeadCheckRefresh:
    name: "Refresh CLA required check"
    needs:
      - CLACommentGate
      - CLASignerPreflight
      - CLAAssistant
    # This is the only check-run writer. It binds the required v3 context to
    # the live PR head after validating the trusted event and exact comment.
    if: >-
      always() &&
      needs.CLACommentGate.result == 'success' &&
      needs.CLACommentGate.outputs.admitted == 'true' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          (
            github.event.action == 'opened' ||
            github.event.action == 'reopened' ||
            github.event.action == 'synchronize' ||
            github.event.action == 'edited' ||
            github.event.action == 'ready_for_review'
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.state == 'open' &&
          github.event.issue.pull_request != null &&
          github.event.comment.user.type == 'User' &&
          github.event.comment.user.id != null &&
          github.event.comment.user.id > 0 &&
          (
            (
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' &&
              needs.CLASignerPreflight.result == 'success' &&
              needs.CLASignerPreflight.outputs.signer_authorized == 'true'
            ) ||
            (
              github.event.comment.body == 'recheck' &&
              (
                github.event.comment.user.id == github.event.issue.user.id ||
                github.event.comment.author_association == 'OWNER' ||
                github.event.comment.author_association == 'MEMBER' ||
                github.event.comment.author_association == 'COLLABORATOR'
              )
            )
          )
        )
      )
    runs-on: ubuntu-24.04 # github-hosted-required: CLA policy jobs
    timeout-minutes: 10
    concurrency:
      group: "cla-check-refresh-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || github.run_id }}"
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
    steps:
      - name: "Checkout trusted CLA refresh worker"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts/refresh-cla-check.sh
          sparse-checkout-cone-mode: false
      - name: "Verify trusted refresh checkout"
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha || '' }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "${WORKFLOW_SHA,,}" ]] || exit 1
          [[ -x .github/scripts/refresh-cla-check.sh ]] || exit 1
      - name: "Publish exact-head CLA v3 check"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_REPO: 'manaflow-ai/cmux-skills'
          REPOSITORY_ID: ${{ github.repository_id || '' }}
          WORKFLOW_SHA: ${{ github.workflow_sha || '' }}
          EXPECTED_GENERATION: 'v2.2-action-212a0f2dd659b24b48a30ba35966e06dc41736af'
          CLA_GENERATION: ${{ env.CLA_GENERATION }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_PR_STATE: ${{ github.event.pull_request.state || '' }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || '' }}
          EVENT_BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id || '' }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          EVENT_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_ISSUE_STATE: ${{ github.event.issue.state || '' }}
          EVENT_ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          EVENT_OPENER_ID: ${{ github.event.issue.user.id || github.event.pull_request.user.id || '' }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_USER_ID: ${{ github.event.comment.user.id || '' }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type || '' }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          GATE_RESULT: ${{ needs.CLACommentGate.result || '' }}
          GATE_ADMITTED: ${{ needs.CLACommentGate.outputs.admitted || '' }}
          PREFLIGHT_RESULT: ${{ needs.CLASignerPreflight.result || '' }}
          SIGNER_AUTHORIZED: ${{ needs.CLASignerPreflight.outputs.signer_authorized || '' }}
          SIGNER_HEAD_SHA: ${{ needs.CLASignerPreflight.outputs.head_sha || '' }}
          SIGNER_BASE_SHA: ${{ needs.CLASignerPreflight.outputs.base_sha || '' }}
          WRITER_RESULT: ${{ needs.CLAAssistant.result || '' }}
          WRITER_POLICY_RESULT: ${{ needs.CLAAssistant.outputs.policy_result || '' }}
          WRITER_HEAD_SHA: ${{ needs.CLAAssistant.outputs.validated_head_sha || '' }}
        run: bash .github/scripts/refresh-cla-check.sh
