name: "CLA Assistant v2"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,closed,reopened,synchronize,edited]

# Jobs declare only the permissions they need.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant v2"
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'edited'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize signer and lock events for this PR. Independent PRs can run
    # concurrently; the maintained action retries shared-ledger writes.
    concurrency:
      group: "cla-signatures-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}"
      cancel-in-progress: false
    # Keep the token scoped to the GitHub API operations used by this job.
    permissions:
      contents: write
      issues: write
      # GitHub's pull_request_target token denied issue comments for fork PRs with
      # this set to read, despite the endpoint documentation allowing issues:write.
      # Keep write until that live behavior changes.
      pull-requests: write
    steps:
      - name: "Reject pull requests with more than 1000 commits"
        # The maintained action paginates commit history safely up to 1,000
        # commits. Keep the workflow admission bound aligned with that limit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref || '' }}"
          EVENT_HEAD_REPO: "${{ github.event.pull_request.head.repo.full_name || '' }}"
          EVENT_HEAD_REPO_ID: "${{ github.event.pull_request.head.repo.id || '' }}"
          EVENT_BASE_SHA: "${{ github.event.pull_request.base.sha || '' }}"
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref || '' }}"
          EVENT_BASE_REPO: "${{ github.event.pull_request.base.repo.full_name || '' }}"
          EVENT_BASE_REPO_ID: "${{ github.event.pull_request.base.repo.id || '' }}"
          EVENT_OPENER_LOGIN: "${{ github.event.pull_request.user.login || '' }}"
          EVENT_OPENER_TYPE: "${{ github.event.pull_request.user.type || '' }}"
          EVENT_OPENER_ID: "${{ github.event.pull_request.user.id || '' }}"
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            case "$EVENT_ACTION" in
              opened|reopened|synchronize|edited) ;;
              *)
                echo "::error::CLA preflight received an unsupported pull request event; refusing to run."
                exit 1
                ;;
            esac
          fi
          if ! live_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '{state: .state, head_sha: .head.sha, head_ref: .head.ref, head_repo: .head.repo.full_name, head_repo_id: .head.repo.id, base_sha: .base.sha, base_ref: .base.ref, base_repo: .base.repo.full_name, base_repo_id: .base.repo.id, opener_login: .user.login, opener_type: .user.type, opener_id: .user.id}' 2>/dev/null)"; then
            echo "::error::CLA preflight could not read live pull request metadata; refusing to run."
            exit 1
          fi
          if ! live_state="$(jq -er '.state' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_sha="$(jq -er '.head_sha' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_ref="$(jq -er '.head_ref' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_repo="$(jq -er '.head_repo' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_repo_id="$(jq -er '.head_repo_id' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_sha="$(jq -er '.base_sha' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_ref="$(jq -er '.base_ref' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_repo="$(jq -er '.base_repo' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_repo_id="$(jq -er '.base_repo_id' <<<"$live_pr" 2>/dev/null)" ||
             ! live_opener_login="$(jq -er '.opener_login' <<<"$live_pr" 2>/dev/null)" ||
             ! live_opener_type="$(jq -er '.opener_type' <<<"$live_pr" 2>/dev/null)" ||
             ! live_opener_id="$(jq -er '.opener_id' <<<"$live_pr" 2>/dev/null)"; then
            echo "::error::CLA preflight returned incomplete pull request metadata; refusing to run."
            exit 1
          fi
          if [[ "$live_state" != "open" ]] ||
             ! [[ "$live_head_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ -z "$live_head_ref" || -z "$live_head_repo" ]] ||
             ! [[ "$live_head_repo_id" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ -z "$live_base_ref" || -z "$live_base_repo" ]] ||
             ! [[ "$live_base_repo_id" =~ ^[1-9][0-9]*$ ]] ||
             [[ -z "$live_opener_login" || "$live_opener_type" != "User" ]] ||
             ! [[ "$live_opener_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CLA preflight found invalid or closed pull request metadata; refusing to run."
            exit 1
          fi
          if [[ "$live_base_repo" != "$GH_REPO" || "$live_base_ref" != "main" ]]; then
            echo "::error::CLA workflow only accepts open pull requests targeting this repository's main branch; refusing to run."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ -z "$EVENT_OPENER_LOGIN" || "$EVENT_OPENER_TYPE" != "User" ]] ||
               ! [[ "$EVENT_OPENER_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::CLA preflight found an invalid pull request opener identity in the event payload; refusing to run."
              exit 1
            fi
            if [[ "$EVENT_HEAD_SHA" != "$live_head_sha" ||
                  "$EVENT_HEAD_REF" != "$live_head_ref" ||
                  "$EVENT_HEAD_REPO" != "$live_head_repo" ||
                  "$EVENT_HEAD_REPO_ID" != "$live_head_repo_id" ||
                  "$EVENT_BASE_SHA" != "$live_base_sha" ||
                  "$EVENT_BASE_REF" != "$live_base_ref" ||
                  "$EVENT_BASE_REPO" != "$live_base_repo" ||
                  "$EVENT_BASE_REPO_ID" != "$live_base_repo_id" ||
                  "$EVENT_OPENER_LOGIN" != "$live_opener_login" ||
                  "$EVENT_OPENER_TYPE" != "$live_opener_type" ||
                  "$EVENT_OPENER_ID" != "$live_opener_id" ]]; then
              echo "::error::CLA preflight pull request metadata does not match the event payload; refusing to run."
              exit 1
            fi
          fi
          if ! commit_count="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits' 2>/dev/null)"; then
            echo "::error::CLA preflight could not read the pull request commit count; refusing to run."
            exit 1
          fi
          if ! [[ "$commit_count" =~ ^[0-9]+$ ]]; then
            echo "::error::CLA preflight returned an invalid pull request commit count; refusing to run."
            exit 1
          fi
          if (( commit_count > 1000 )); then
            echo "::error::CLA Assistant v2 accepts at most 1000 pull request commits. Split this pull request to 1000 or fewer commits before signing."
            exit 1
          fi
      - name: "Validate CLA comment command"
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]] &&
             [[ "$COMMENT_BODY" != "recheck" ]] &&
             [[ "$COMMENT_BODY" != "I have read the CLA Document and I hereby sign the CLA" ]]; then
            echo "::error::CLA workflow accepts only the exact recheck command or exact electronic signature phrase; refusing to run."
            exit 1
          fi
      - name: "Reject ambiguous historical CLA comments"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EXACT_SIGN_PHRASE: 'I have read the CLA Document and I hereby sign the CLA'
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target|issue_comment) ;;
            *) echo "::error::CLA history guard received an unsupported event; refusing to run."; exit 1 ;;
          esac
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CLA history guard received an invalid pull request number; refusing to run."
            exit 1
          fi
          comments_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}/comments"
          page=1
          while (( page <= 10 )); do
            if ! page_json="$(gh api "${comments_endpoint}?per_page=100&page=${page}" 2>/dev/null)"; then
              echo "::error::CLA history guard could not read issue comments; refusing to run."
              exit 1
            fi
            if ! jq -e 'type == "array" and all(.[]; ((.body | type) == "string" and (.user.login | type) == "string" and (.user.type | type) == "string" and (.user.id | type) == "number" and (.user.id | . > 0) and (.user.id | . == floor)))' <<<"$page_json" >/dev/null 2>&1; then
              echo "::error::CLA history guard received malformed issue comments; refusing to run."
              exit 1
            fi
            if ! page_count="$(jq -r 'length' <<<"$page_json" 2>/dev/null)" ||
               ! [[ "$page_count" =~ ^[0-9]+$ ]] || (( page_count > 100 )); then
              echo "::error::CLA history guard received an invalid issue-comment page; refusing to run."
              exit 1
            fi
            if ! ambiguous_count="$(jq -r --arg exact "$EXACT_SIGN_PHRASE" '
              def normalized: sub("^\\s+"; "") | sub("\\s+$"; "") | ascii_downcase;
              # The action finds its generated prompt by this public marker,
              # so trust only the canonical GitHub Actions identity.
              def canonical_bot:
                .user.login == "github-actions[bot]" and
                .user.type == "Bot" and
                .user.id == 41898282;
              [ .[]
                | select(
                    (
                      ((.body | test("CLA Assistant Lite bot"; "s")) and (canonical_bot | not))
                      or
                      (
                        (canonical_bot | not)
                        and ((.body | normalized) | test("i\\s*have\\s*read\\s*the\\s*cla\\s*document\\s*and\\s*i\\s*hereby\\s*sign\\s*the\\s*cla"; "s"))
                        and (.user.login == "github-actions[bot]" or .user.type != "User" or .body != $exact)
                      )
                    )
                  )
              ] | length
            ' <<<"$page_json" 2>/dev/null)" ||
               ! [[ "$ambiguous_count" =~ ^[0-9]+$ ]]; then
              echo "::error::CLA history guard could not inspect issue-comment bodies; refusing to run."
              exit 1
            fi
            if (( ambiguous_count > 0 )); then
              echo "::error::CLA history guard found an ambiguous historical CLA comment or bot marker; refusing to run."
              exit 1
            fi
            if (( page_count < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          if (( page == 11 )); then
            if ! overflow_json="$(gh api "${comments_endpoint}?per_page=1&page=11" 2>/dev/null)"; then
              echo "::error::CLA history guard could not verify the 1000-comment limit; refusing to run."
              exit 1
            fi
            if ! jq -e 'type == "array" and all(.[]; ((.body | type) == "string" and (.user.login | type) == "string" and (.user.type | type) == "string" and (.user.id | type) == "number" and (.user.id | . > 0) and (.user.id | . == floor)))' <<<"$overflow_json" >/dev/null 2>&1; then
              echo "::error::CLA history guard received malformed overflow comments; refusing to run."
              exit 1
            fi
            if ! overflow_count="$(jq -r 'length' <<<"$overflow_json" 2>/dev/null)" ||
               ! [[ "$overflow_count" =~ ^[0-9]+$ ]]; then
              echo "::error::CLA history guard received an invalid overflow page; refusing to run."
              exit 1
            fi
            if (( overflow_count > 0 )); then
              echo "::error::CLA history guard refuses pull requests with more than 1000 issue comments; refusing to run."
              exit 1
            fi
          fi
      - name: "CLA Assistant v2"
        # The action handles signing and status updates. Merged pull requests
        # are locked by the separate job to keep lock permissions isolated.
        uses: manaflow-ai/cla-github-action@09d64fa8ba8b77ae253f354be6e1564d49317fa3 # reviewed maintained fork runtime+dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/manaflow-ai/cmux-skills/blob/${{ github.workflow_sha }}/CLA.md'
          # Locking is handled by the merged-only job below, which supplies a
          # valid reason and verifies the resulting lock state.
          lock-pullrequest-aftermerge: 'false'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          required-base-ref: 'main'
          require-opener-as-author: 'true'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Share the signer group for this PR so a merge lock cannot race its
      # final signature update. Independent PRs remain concurrent.
      group: "cla-signatures-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}"
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_REPO: "${{ github.event.repository.full_name || '' }}"
          EVENT_REPO_ID: "${{ github.event.repository.id || '' }}"
          PR_NUMBER: "${{ github.event.pull_request.number || '' }}"
          EVENT_ACTION: "${{ github.event.action || '' }}"
          EVENT_STATE: "${{ github.event.pull_request.state || '' }}"
          EVENT_MERGED: "${{ github.event.pull_request.merged || false }}"
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref || '' }}"
          EVENT_BASE_REPO: "${{ github.event.pull_request.base.repo.full_name || '' }}"
          EVENT_BASE_REPO_ID: "${{ github.event.pull_request.base.repo.id || '' }}"
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref || '' }}"
          EVENT_HEAD_REPO: "${{ github.event.pull_request.head.repo.full_name || '' }}"
          EVENT_HEAD_REPO_ID: "${{ github.event.pull_request.head.repo.id || '' }}"
          EVENT_OPENER_LOGIN: "${{ github.event.pull_request.user.login || '' }}"
          EVENT_OPENER_ID: "${{ github.event.pull_request.user.id || '' }}"
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$EVENT_REPO" == "$GH_REPO" ]] || fail "CLA lock event targets an unexpected repository."
          [[ "$EVENT_REPO_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid repository ID."
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid pull request number."
          if [[ "$EVENT_ACTION" != "closed" || "$EVENT_STATE" != "closed" || "$EVENT_MERGED" != "true" ]]; then
            fail "CLA lock event is not a closed merged pull request."
          fi
          [[ "$EVENT_BASE_REF" == "main" ]] || fail "CLA lock event targets an unexpected base branch."
          [[ "$EVENT_BASE_REPO" == "$GH_REPO" ]] || fail "CLA lock event targets an unexpected base repository."
          [[ "$EVENT_BASE_REPO_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid base repository ID."
          [[ "$EVENT_BASE_REPO_ID" == "$EVENT_REPO_ID" ]] || fail "CLA lock event base repository ID does not match the event repository."
          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || fail "CLA lock event has no valid head SHA."
          if [[ -z "$EVENT_HEAD_REF" || "$EVENT_HEAD_REF" == *$'\n'* || "$EVENT_HEAD_REF" == *$'\r'* ]]; then
            fail "CLA lock event has no valid head ref."
          fi
          if [[ -z "$EVENT_HEAD_REPO" || -z "$EVENT_HEAD_REPO_ID" ]]; then
            [[ -z "$EVENT_HEAD_REPO" && -z "$EVENT_HEAD_REPO_ID" ]] || fail "CLA lock event has incomplete head repository metadata."
          else
            [[ "$EVENT_HEAD_REPO" == */* && "$EVENT_HEAD_REPO" != */*/* ]] || fail "CLA lock event has no valid head repository."
            [[ "$EVENT_HEAD_REPO_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid head repository ID."
          fi
          if [[ -z "$EVENT_OPENER_LOGIN" || "$EVENT_OPENER_LOGIN" == *$'\n'* || "$EVENT_OPENER_LOGIN" == *$'\r'* ]]; then
            fail "CLA lock event has no valid pull request opener."
          fi
          [[ "$EVENT_OPENER_ID" =~ ^[1-9][0-9]*$ ]] || fail "CLA lock event has no valid opener ID."

          if ! live_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '{number: .number, state: .state, merged: .merged, base_ref: .base.ref, base_repo: .base.repo.full_name, base_repo_id: .base.repo.id, head_sha: .head.sha, head_ref: .head.ref, head_repo: (.head.repo | if . == null then null else {full_name: .full_name, id: .id} end), opener_login: .user.login, opener_id: .user.id}' 2>/dev/null)"; then
            fail "CLA lock step could not read live pull request metadata."
          fi
          # GitHub can advance or delete a source branch after merge. Validate
          # the live head shape, but bind only immutable base and opener data
          # to the closed event.
          if ! jq -e \
            --arg repo "$GH_REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg base_ref "$EVENT_BASE_REF" \
            --argjson base_repo_id "$EVENT_BASE_REPO_ID" \
            --arg opener_login "$EVENT_OPENER_LOGIN" \
            --argjson opener_id "$EVENT_OPENER_ID" '
              def nonempty_string:
                type == "string" and length > 0 and test("^[^\\r\\n]+$");
              def positive_integer:
                type == "number" and . > 0 and . == floor;
              def valid_head_repo:
                . == null or (
                  type == "object" and
                  (.full_name | nonempty_string and test("^[^/]+/[^/]+$")) and
                  (.id | positive_integer)
                );
              .number == $pr_number and
              .state == "closed" and
              .merged == true and
              (.base_ref | nonempty_string and . == $base_ref and . == "main") and
              (.base_repo | nonempty_string and ascii_downcase == ($repo | ascii_downcase)) and
              (.base_repo_id | positive_integer and . == $base_repo_id) and
              (.head_sha | type == "string" and test("^[0-9a-fA-F]{40}$")) and
              (.head_ref | nonempty_string) and
              (.head_repo | valid_head_repo) and
              (.opener_login | nonempty_string and ascii_downcase == ($opener_login | ascii_downcase)) and
              (.opener_id | positive_integer and . == $opener_id)
            ' <<<"$live_pr" >/dev/null 2>&1; then
            fail "CLA lock step found invalid or changed merged pull request identity."
          fi

          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            fail "CLA lock step could not read the pull request lock state."
          fi
          if [[ "$locked" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          [[ "$locked" == "false" ]] || fail "CLA lock step returned an invalid pull request lock state."
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>&1; then
            fail "CLA lock step could not lock the merged pull request."
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            fail "CLA lock step could not verify the pull request lock state."
          fi
          if [[ "$locked" != "true" ]]; then
            fail "CLA lock step did not observe the pull request as locked."
          fi
