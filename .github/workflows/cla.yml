name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,closed,reopened,synchronize,edited]

# Jobs declare only the permissions they need.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant"
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signature updates share one file and must not race. Keep all pending
    # events instead of replacing the previous pending run.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    # Keep the token scoped to the GitHub API operations used by this job.
    permissions:
      # Temporary exception: the archived action reruns a failed check after
      # signing. Remove write when the maintained in-organization fork lands.
      actions: write
      contents: write
      issues: write
      # GitHub's pull_request_target token denied issue comments for fork PRs with
      # this set to read, despite the endpoint documentation allowing issues:write.
      # Keep write until that live behavior changes.
      pull-requests: write
    steps:
      - name: "Reject pull requests with more than 100 commits"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha || '' }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref || '' }}"
          EVENT_HEAD_REPO: "${{ github.event.pull_request.head.repo.full_name || '' }}"
          EVENT_HEAD_REPO_ID: "${{ github.event.pull_request.head.repo.id || '' }}"
          EVENT_BASE_SHA: "${{ github.event.pull_request.base.sha || '' }}"
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref || '' }}"
          EVENT_BASE_REPO: "${{ github.event.pull_request.base.repo.full_name || '' }}"
          EVENT_BASE_REPO_ID: "${{ github.event.pull_request.base.repo.id || '' }}"
        run: |
          set -euo pipefail
          if ! live_pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '{state: .state, head_sha: .head.sha, head_ref: .head.ref, head_repo: .head.repo.full_name, head_repo_id: .head.repo.id, base_sha: .base.sha, base_ref: .base.ref, base_repo: .base.repo.full_name, base_repo_id: .base.repo.id}' 2>/dev/null)"; then
            echo "::error::CLA preflight could not read live pull request metadata; refusing to run."
            exit 1
          fi
          if ! live_state="$(jq -er '.state' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_sha="$(jq -er '.head_sha' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_ref="$(jq -er '.head_ref' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_repo="$(jq -er '.head_repo' <<<"$live_pr" 2>/dev/null)" ||
             ! live_head_repo_id="$(jq -er '.head_repo_id' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_sha="$(jq -er '.base_sha' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_ref="$(jq -er '.base_ref' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_repo="$(jq -er '.base_repo' <<<"$live_pr" 2>/dev/null)" ||
             ! live_base_repo_id="$(jq -er '.base_repo_id' <<<"$live_pr" 2>/dev/null)"; then
            echo "::error::CLA preflight returned incomplete pull request metadata; refusing to run."
            exit 1
          fi
          if [[ "$live_state" != "open" ]] ||
             ! [[ "$live_head_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ -z "$live_head_ref" || -z "$live_head_repo" ]] ||
             ! [[ "$live_head_repo_id" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ -z "$live_base_ref" || -z "$live_base_repo" ]] ||
             ! [[ "$live_base_repo_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CLA preflight found invalid or closed pull request metadata; refusing to run."
            exit 1
          fi
          if [[ "$live_base_repo" != "$GH_REPO" || "$live_base_ref" != "main" ]]; then
            echo "::error::CLA workflow only accepts open pull requests targeting this repository's main branch; refusing to run."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ "$EVENT_HEAD_SHA" != "$live_head_sha" ||
                  "$EVENT_HEAD_REF" != "$live_head_ref" ||
                  "$EVENT_HEAD_REPO" != "$live_head_repo" ||
                  "$EVENT_HEAD_REPO_ID" != "$live_head_repo_id" ||
                  "$EVENT_BASE_SHA" != "$live_base_sha" ||
                  "$EVENT_BASE_REF" != "$live_base_ref" ||
                  "$EVENT_BASE_REPO" != "$live_base_repo" ||
                  "$EVENT_BASE_REPO_ID" != "$live_base_repo_id" ]]; then
              echo "::error::CLA preflight pull request metadata does not match the event payload; refusing to run."
              exit 1
            fi
          fi
          if ! commit_count="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits' 2>/dev/null)"; then
            echo "::error::CLA preflight could not read the pull request commit count; refusing to run."
            exit 1
          fi
          if ! [[ "$commit_count" =~ ^[0-9]+$ ]]; then
            echo "::error::CLA preflight returned an invalid pull request commit count; refusing to run."
            exit 1
          fi
          if (( commit_count > 100 )); then
            echo "::error::CLA Assistant only evaluates the first 100 pull request commits. Squash this pull request to 100 or fewer commits before signing."
            exit 1
          fi
      - name: "CLA Assistant"
        # The action handles signing and status updates. Merged pull requests
        # are locked by the separate job because the archived action sends an
        # invalid lock request.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/manaflow-ai/cmux-skills/blob/${{ github.workflow_sha }}/CLA.md'
          # The archived action calls the lock endpoint without the required
          # lock_reason. Disable that broken path and use the explicit step
          # below, which supplies a valid reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error::CLA lock step could not read the pull request lock state; refusing to continue."
            exit 1
          fi
          if [[ "$locked" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>&1; then
            echo "::error::CLA lock step could not lock the merged pull request."
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error::CLA lock step could not verify the pull request lock state."
            exit 1
          fi
          if [[ "$locked" != "true" ]]; then
            echo "::error::CLA lock step did not observe the pull request as locked."
            exit 1
          fi
