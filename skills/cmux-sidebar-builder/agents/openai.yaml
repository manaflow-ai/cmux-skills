interface:
  display_name: "cmux Sidebar Builder"
  short_description: "Build custom sidebar views with cmux's runtime SwiftUI-style interpreter."
  default_prompt: "Use this skill to create, inspect, or revise cmux custom sidebars in ~/.config/cmux/sidebars using the runtime Swift interpreter and current cmux docs/source entrypoints. Open dogfood sidebars with cmux sidebar open <name> so they render as Bonsplit pane tabs; do not use right-sidebar set <name>."
